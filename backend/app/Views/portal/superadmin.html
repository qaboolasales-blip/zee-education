<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Zee Education — Super Admin</title>
<style>

:root[data-theme="dark"]{--bg:#0a0f1d;--card:#121a2d;--ink:#eef2fb;--muted:#93a0b8;--line:#212b44;--soft:#18233f;--side:#070c18;--shadow:0 8px 30px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.shell{display:grid;grid-template-columns:268px 1fr;min-height:100vh;transition:.25s}.shell.collapsed{grid-template-columns:0 1fr}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:#dbe4f4;padding:22px 14px;display:flex;flex-direction:column;gap:16px;overflow:hidden;transition:.25s}.collapsed .side{padding:0;opacity:0;pointer-events:none}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 22px color-mix(in srgb,var(--brand) 40%,transparent)}
.brand b{font-size:16px}.brand small{display:block;color:#8b9ab3;font-size:11px;margin-top:2px}
.sc{margin:0 4px;padding:13px;border-radius:16px;background:linear-gradient(135deg,#ffffff0f,#ffffff05);border:1px solid #ffffff14;display:flex;gap:10px;align-items:center}.sc i{width:34px;height:34px;border-radius:11px;background:#ffffff14;display:grid;place-items:center;font-style:normal}.sc b{font-size:13px}.sc p{margin:3px 0 0;font-size:11px;color:#8b9ab3}
.lbl{font-size:10px;letter-spacing:.14em;color:#6b7a95;font-weight:700;margin:4px 12px 0}

.nav button:hover{background:#ffffff0d;color:#fff}.nav button.on{background:linear-gradient(100deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 35%,transparent)}.nav i{font-style:normal;width:18px;text-align:center;font-size:16px}

.main{min-width:0}.top{position:sticky;top:0;z-index:20;height:72px;display:flex;align-items:center;gap:14px;padding:0 28px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}

.crumb span{font-size:11px;color:var(--muted)}.crumb b{display:block;font-size:15px;margin-top:1px}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:13px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}.search input{flex:1;border:0;background:none;outline:0;font-size:13px}.search kbd{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.acts{margin-left:auto;display:flex;gap:9px;align-items:center}.dot:after{content:'';position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:#ef4444;border:2px solid var(--card)}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;background:linear-gradient(135deg,#8b5cf6,#5b21b6)}
.wrap{max-width:1500px;margin:auto;padding:30px 28px 50px;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hd{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:22px;flex-wrap:wrap}.eb{font-size:11px;font-weight:700;color:var(--brand);letter-spacing:.12em;text-transform:uppercase}.hd h1{font-size:30px;letter-spacing:-.03em;margin:6px 0 4px}.hd p{margin:0;color:var(--muted);font-size:13px;max-width:560px}
.bs{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;font-size:13px;font-weight:700;transition:.2s}.btn:hover{transform:translateY(-1px)}
.btn.p{border:0;color:#fff;background:linear-gradient(110deg,var(--brand),var(--brand2));box-shadow:0 10px 22px color-mix(in srgb,var(--brand) 30%,transparent)}.btn.w{width:100%;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.pn{padding:20px}

.stat:first-child{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0}.stat:first-child label,.stat:first-child small{color:#ffffffcc}
.ri{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}.stat:first-child .ri{background:#ffffff26;color:#fff}
.stat label{display:block;margin-top:14px;font-size:12px;color:var(--muted);font-weight:600}.stat strong{display:block;font-size:26px;letter-spacing:-.03em;margin-top:4px}.stat small{font-size:12px;color:var(--muted)}
.tag{position:absolute;top:18px;right:16px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:4px 8px;border-radius:99px}.stat:first-child .tag{color:#fff;background:#ffffff2e}
.g2{display:grid;grid-template-columns:1.4fr .9fr;gap:14px;margin-top:14px}.g3e{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ph{display:flex;justify-content:space-between;align-items:start;gap:8px}.t{font-size:15px;font-weight:700}.s{font-size:12px;color:var(--muted);margin-top:3px}
.pill{font-size:11px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.bars{height:210px;display:flex;align-items:end;gap:10px;margin-top:16px;border-bottom:1px solid var(--line);padding-bottom:0;background:repeating-linear-gradient(to bottom,transparent 0 51px,var(--line) 52px 53px)}.bg{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:end;height:100%;font-size:11px;color:var(--muted)}.bg div{display:flex;gap:5px;align-items:end}.bg i{width:20px;border-radius:8px 8px 3px 3px;background:var(--c);height:var(--h)}
.lg{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--muted)}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.rr{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.rr:last-child{border:0}.rr b{font-size:13px;display:block}.rr span{font-size:12px;color:var(--muted)}.rr small{font-size:12px;font-weight:700;color:#d97706}
.ini{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--c,var(--brand)) 15%,transparent);color:var(--c,var(--brand))}
.tb{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{padding:13px 16px;text-align:left;font-size:11px;letter-spacing:.06em;color:var(--muted);background:var(--bg);text-transform:uppercase}td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}tr:hover td{background:var(--soft)}
.pe{display:flex;gap:10px;align-items:center}.pe b{display:block}.pe small{color:var(--muted);font-size:11px}
.bd{display:inline-block;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700}.g{background:color-mix(in srgb,#10b981 15%,transparent);color:#059669}.w{background:color-mix(in srgb,#f59e0b 18%,transparent);color:#b45309}.r{background:color-mix(in srgb,#ef4444 15%,transparent);color:#dc2626}.n{background:var(--soft);color:var(--muted)}
.lk{border:0;background:none;color:var(--brand);font-weight:700;font-size:13px}
.tool{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}select,.in{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:13px;width:100%}.tool select{width:auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.fg label{font-size:12px;color:var(--muted);font-weight:600}.fg select,.fg .in{margin-top:5px}
.sm{padding:20px}.sm label{font-size:12px;color:var(--muted);font-weight:600}.sm strong{display:block;font-size:24px;letter-spacing:-.03em;margin:6px 0}.sm span{font-size:12px;color:var(--muted)}
.ar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.ar:last-child{border:0}.ar b{font-size:13px;display:block}.ar span{font-size:12px;color:var(--muted)}
.flow{display:flex;gap:6px;margin:14px 0}.flow div{flex:1;padding:11px 4px;text-align:center;border-radius:12px;background:var(--bg);font-size:12px;color:var(--muted)}.flow .d{background:color-mix(in srgb,#10b981 15%,transparent);color:#059669;font-weight:700}.flow .nw{background:var(--soft);color:var(--brand);font-weight:700}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.plan{padding:22px;position:relative}.plan.pop{border:2px solid var(--brand)}.plan h3{margin:0;font-size:18px}.plan p{font-size:12px;color:var(--muted);line-height:1.5;min-height:36px}.plan label{font-size:12px;font-weight:700;color:var(--brand)}.plan ul{list-style:none;padding:0;margin:14px 0;display:grid;gap:10px}.plan li{font-size:13px}.plan li:before{content:'✓';color:#10b981;font-weight:900;margin-right:8px}
.rb{position:absolute;right:16px;top:16px;background:var(--soft);color:var(--brand);font-size:11px;font-weight:800;padding:5px 9px;border-radius:99px}
.ad{padding:16px}.ad i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--brand);font-style:normal;font-size:17px}.ad b{display:block;margin-top:12px;font-size:14px}.ad span{display:block;font-size:12px;color:var(--muted);margin:3px 0 8px}
.tk{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.tk:last-child{border:0}.tk i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--brand);font-style:normal}.tk b{font-size:13px}.tk small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tr{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:10px}.pp{width:34px;height:44px;border-radius:6px;border:1px solid var(--line);background:linear-gradient(var(--brand) 0 9px,var(--bg) 9px)}.tr b{font-size:13px;display:block}.tr small{font-size:12px;color:var(--muted)}
.tg{width:42px;height:24px;border:0;border-radius:20px;background:var(--brand);position:relative}.tg:after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;right:3px;top:3px}.tg.off{background:var(--line)}.tg.off:after{right:auto;left:3px}
.th{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.tm{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}.tm.on{box-shadow:0 0 0 3px var(--brand)}
.bt,.shade{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,100px);background:#0f172a;color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;box-shadow:0 14px 34px #0005;opacity:0;transition:.3s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,white);outline-offset:2px}
@media(max-width:1280px){.stats,.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:1100px){.shell,.shell.collapsed{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:50;transform:translateX(-105%);opacity:1;padding:22px 14px;pointer-events:auto}body.open .side{transform:none}body.open .shade{display:block;position:fixed;inset:0;background:#0b132499;z-index:45;backdrop-filter:blur(3px)}.plans{grid-template-columns:1fr}}
@media(max-width:780px){body{padding-bottom:78px}.top{padding:0 14px;height:64px}.search,.hl{display:none}.wrap{padding:20px 14px 30px}.hd h1{font-size:24px}.stats{gap:10px}.g3e{grid-template-columns:1fr}.fg{grid-template-columns:1fr}.tr{grid-template-columns:44px 1fr}.tr>span,.tr>button{grid-column:2}
.bt{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:64px;padding:6px;border-radius:22px;z-index:30;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 12px 30px #0f172a2e}.bt button{border:0;background:none;border-radius:16px;font-size:10px;font-weight:600;color:var(--muted);display:grid;place-items:center;align-content:center;gap:1px}.bt i{font-style:normal;font-size:17px}.bt button.on{background:var(--brand);color:#fff}}
@media(max-width:480px){.stats,.g4{grid-template-columns:1fr}}
</style>
<style id="m3-dashboard-refresh">
/* Material 3-inspired dark command header and tonal mobile navigation */
.top{height:78px!important;background:linear-gradient(105deg,#0b1628 0%,#142b4a 62%,#1c3963 100%)!important;border-bottom-color:#2b4262!important;box-shadow:0 10px 28px rgba(7,18,35,.22)!important;color:#fff}.top .crumb{min-width:178px}.top .crumb span{color:#b3c2d6}.top .crumb b{color:#fff}.top .search{background:#ffffff0d;border-color:#ffffff1e;color:#becce0}.top .search input{color:#fff}.top .search input::placeholder{color:#aab9cd}.top .search kbd{border-color:#ffffff23;color:#cbd7e6;background:#ffffff0b}.top .ib{background:#ffffff0d;border-color:#ffffff22;color:#fff}.top .ib:hover{background:#ffffff1c}.top .dot:after{border-color:#17304f}.top .av{box-shadow:0 5px 14px #0004}.mode{font-size:16px!important}.bt{background:color-mix(in srgb,var(--card) 90%,transparent)!important}.bt button.on{background:var(--soft)!important;color:var(--brand)!important;box-shadow:none!important}.bt button.on:before{content:'';position:absolute;width:38px;height:28px;border-radius:99px;background:color-mix(in srgb,var(--brand) 12%,transparent);z-index:-1}.bt button{position:relative}.nav button.on{box-shadow:0 9px 22px color-mix(in srgb,var(--brand) 32%,transparent)}

</style></head><body>
<div class="shell" id="shell"><aside class="side"><div class="brand"><div class="logo">Z</div><div><b>Zee Education</b><small>Platform control center</small></div></div><div class="sc"><i>♜</i><div><b>Super Admin</b><p>Platform workspace</p></div></div><div class="lbl">PLATFORM</div><nav class="nav" id="nav"></nav><div class="foot"><b>Platform separation</b><br>Super Admin installations aur commercial records manage karta hai; school academic data isolated rehta hai.</div></aside>
<main class="main"><header class="top"><button class="ib" id="mb" aria-label="Menu">☰</button><div class="crumb"><span>Zee Education platform</span><b id="crumb">Overview</b></div><label class="search">⌕<input id="q" placeholder="Search schools, tickets or invoices…"><kbd>Enter</kbd></label><div class="acts"><button class="ib mode" id="mode" aria-label="Toggle appearance">◐</button><button class="ib dot" onclick="notice('3 renewal notifications in demo')">🔔</button><button class="ib hl" onclick="notice('Quick platform actions preview')">＋</button><div class="av">ZA</div></div></header>
<section class="wrap" id="wrap"></section></main></div><div class="shade" onclick="document.body.classList.remove('open')"></div><nav class="bt" id="bt"></nav><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),root=document.documentElement;let page='Overview';
const notice=x=>{const t=$('toast');t.textContent=x;t.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>t.classList.remove('show'),2400)};
const N=[['Overview','⌂'],['Schools & Installs','▦'],['Plans & Add-ons','◇'],['Billing & Renewals','₨'],['Print Templates','▤'],['Support Tickets','☏'],['System Settings','⚙']];
$('nav').innerHTML=N.map(n=>`<button data-p="${n[0]}"><i>${n[1]}</i>${n[0]}</button>`).join('');
$('bt').innerHTML=[['Overview','⌂','Home'],['Schools & Installs','▦','Schools'],['Billing & Renewals','₨','Billing'],['Support Tickets','☏','Support'],['menu','☰','Menu']].map(n=>`<button data-p="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join('');
const H=(e,t,s,a='')=>`<div class="hd"><div><div class="eb">${e}</div><h1>${t}</h1><p>${s}</p></div><div class="bs">${a}</div></div>`;
const B=(t,n,p)=>`<button class="btn${p?' p':''}" onclick="notice('${n}')">${t}</button>`;
const bd=(c,t)=>`<span class="bd ${c}">${t}</span>`;
const ini=(n,c)=>`<div class="ini" style="--c:${c||'var(--brand)'}">${n.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>`;
const table=(h,r)=>`<div class="tb"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const sm=(l,v,s)=>`<div class="card sm"><label>${l}</label><strong>${v}</strong><span>${s}</span></div>`;
const SC=__ZEE_SCHOOLS__;
const stc=s=>s==='Active'?'g':s==='Renewal due'?'w':'n';
const schoolsRows=()=>SC.map(x=>[`<div class="pe">${ini(x[0],x[7])}<div><b>${x[0]}</b><small>${x[1]}</small></div></div>`,x[2],x[3],bd(x[4]==='Dedicated'?'g':'w',x[4]),bd(stc(x[5]),x[5]),x[6],`<button class="lk" onclick="notice('Record: ${x[0]}')">Manage</button>`]);
const SH=['School','Domain','Plan','Database','Status','Renewal',''];
const ST=__ZEE_STATS__;
const PG={
Overview:()=>H('Platform control center','Super Admin Overview','Schools, installations, negotiated renewals aur support — ek secure workspace se.',B('▣ Review renewals','Renewal list filtered')+B('＋ Add school','Add school form preview',1))+
`<div class="stats">${ST.map(s=>`<div class="card stat" style="--c:${s[5]}"><div class="ri">${s[0]}</div><span class="tag">${s[4]}</span><label>${s[1]}</label><strong>${s[2]}</strong><small>${s[3]}</small></div>`).join('')}</div>
<div class="g2"><article class="card pn"><div class="ph"><div><div class="t">Installation & renewal trend</div><div class="s">New installs aur renewal collection</div></div><span class="pill">Last 6 months</span></div><div class="bars">${[['May',57,38],['Jun',80,49],['Jul',66,89],['Aug',104,75],['Sep',91,121],['Oct',137,107]].map(x=>`<div class="bg"><div><i style="--h:${x[1]}px;--c:#3b82f6"></i><i style="--h:${x[2]}px;--c:#10b981"></i></div>${x[0]}</div>`).join('')}</div><div class="lg"><span><i style="--c:#3b82f6"></i>New installations</span><span><i style="--c:#10b981"></i>Renewal collection</span></div></article>
<article class="card pn"><div class="ph"><div><div class="t">Renewals needing attention</div><div class="s">Due date se pehle reminder bhejein</div></div><button class="lk" onclick="go('Billing & Renewals')">View all →</button></div>${__ZEE_RENEWALS__.map(x=>`<div class="rr">${ini(x[0],x[3])}<div><b>${x[0]}</b><span>${x[1]}</span></div><small>Due in ${x[2]}</small></div>`).join('')}</article></div>
<article class="card" style="margin-top:14px"><div class="ph pn"><div><div class="t">School installations</div><div class="s">Har school ki apni installation aur database status.</div></div><div class="bs">${B('⇩ Export','Export is a UI demo')}</div></div>${table(SH,schoolsRows())}</article>
<div class="plans" style="margin-top:14px">${PL()}</div>`,
'Schools & Installs':()=>H('Tenant management','Schools & Installations','Isolated school installations provision, check aur manage karein.',B('⇩ Export','Export preview')+B('＋ Add school','Provisioning form preview',1))+`<div class="tool"><label class="search" style="flex:1;max-width:none">⌕<input placeholder="Search schools, domain or city"></label><select><option>All plans</option><option>Starter</option><option>Growth</option><option>Complete</option></select><select><option>All states</option><option>Active</option><option>Provisioning</option></select></div><article class="card">${table(SH,schoolsRows())}</article><div class="g2" style="grid-template-columns:1fr 1fr"><article class="card pn"><div class="t">Install lifecycle</div><div class="s">${__ZEE_INSTALL_HEALTH__} · provisioning health</div><div class="flow"><div class="d">1<br>Approved</div><div class="d">2<br>Database</div><div class="d">3<br>Migration</div><div class="d">4<br>Domain</div><div class="nw">5<br>Active</div></div>${B('View health log','Health log preview')}</article><article class="card pn"><div class="t">Isolation note</div><div class="s" style="line-height:1.6;margin:6px 0 12px">School academic aur finance records usi installation/database ke hain. Platform users metadata manage karte hain, student data default browse nahin karte.</div>${bd('g','Dedicated database required')}</article></div>`,
'Plans & Add-ons':()=>H('Commercial catalogue','Plans & Add-ons','Proposed plan banayein ya school-specific negotiated quote tayyar karein.',B('＋ Custom quote','Custom quote builder preview',1))+`<div class="plans">${PL()}</div><h3 style="margin:24px 0 12px">Individual add-ons</h3><div class="g4">${[['▦','Additional campus','Separately quoted'],['₨','Payroll module','Separately quoted'],['⚙','Custom fields','Separately quoted'],['▤','Custom print design','One-time fee']].map(x=>`<article class="card ad"><i>${x[0]}</i><b>${x[1]}</b><span>${x[2]}</span><button class="lk" onclick="notice('Add-on quote preview')">Add to quote</button></article>`).join('')}</div>`,
'Billing & Renewals':()=>H('Commercial records','Billing & Renewals','Setup, first-year, renewal aur hosting/domain alag negotiated items hain.',B('⇩ Billing export','Billing export preview')+B('＋ Create quote','Billing quote preview',1))+`<div class="g3e">${sm('SETUP / INSTALLATION','One-time','Quote per school')}${sm('LICENSE RENEWAL','Annual','Negotiated per school')}${sm('HOSTING / DOMAIN','Separate','License mein merge nahin')}</div><div class="g2"><article class="card pn"><div class="t">School rate book</div><div class="s">Sample UI values · authorized commercial workflow se edit hon.</div>${__ZEE_RATEBOOK__.map(x=>`<div class="ar"><div><b>${x[0]}</b><span>${x[1]} · annual renewal</span></div><div style="display:flex;gap:8px;align-items:center"><input class="in" style="width:110px;height:36px" value="${x[2]}"><button class="lk" onclick="notice('Rate update preview')">Save</button></div></div>`).join('')}</article><article class="card pn"><div class="t">Renewal reminder</div><div class="s" style="line-height:1.5">Delivery claim karne se pehle real email service chahiye.</div><div class="fg" style="grid-template-columns:1fr"><label>School<select>${__ZEE_SCHOOL_OPTIONS__}</select></label></div>${B('Prepare reminder','Preview only — email not connected',1).replace('class="btn p"','class="btn p w"')}</article></div>`,
'Print Templates':()=>H('School-specific documents','Print Templates','Built-in forms free hain; custom HTML/CSS design Super Admin controlled hai.',B('＋ Custom template','Template editor preview',1))+`<div class="g2" style="margin-top:0"><article class="card pn"><div class="t">Free built-in templates</div><div class="s">School bina design charge ke select kar sakta hai.</div>${['Admission form','Teacher form','Student ID card','Result card'].map(x=>`<div class="tr"><div class="pp"></div><div><b>${x}</b><small>Brand logo/colors aur approved fields apply hote hain</small></div>${bd('g','Free')}<button class="lk" onclick="notice('${x} preview')">Preview</button></div>`).join('')}</article><article class="card pn"><div class="t">Custom template rules</div><div class="s" style="line-height:1.6;margin:6px 0">Sirf Super Admin custom design approve karta hai. Client ka reference image/PDF guide ho sakta hai; fields data-driven rehte hain.</div><div class="ar"><div><b>Design fee</b><span>Approval ke baad one-time</span></div>${bd('w','Charge once')}</div><div class="ar"><div><b>Future reprints</b><span>Approved design use hota hai</span></div>${bd('g','Included')}</div>${B('Review custom requests','Approved design list preview').replace('class="btn"','class="btn w"')}</article></div>`,
'Support Tickets':()=>H('School support','Support Tickets','Installation, billing, templates aur product support requests track karein.',B('＋ Create ticket','New ticket preview',1))+`<article class="card pn"><div class="ph"><div><div class="t">Open tickets</div><div class="s">School Admin apne workspace se request submit karta hai.</div></div>${bd('w',__ZEE_TICKET_COUNT__)}</div>${__ZEE_TICKETS__.map(x=>`<div class="tk"><i>☏</i><div><b>${x[0]} · ${x[2]}</b><small>${x[1]} · Updated ${x[4]}</small></div>${bd(x[3]==='High'?'r':'w',x[3])}</div>`).join('')}</article><div class="g2" style="grid-template-columns:1fr 1fr"><article class="card pn"><div class="t">Ticket workflow</div><div class="flow"><div class="d">New</div><div class="nw">In review</div><div>Waiting</div><div>Resolved</div></div><div class="s">Ticket text mein unnecessary student data na likhein.</div></article><article class="card pn"><div class="t">Support access rule</div><div class="s" style="line-height:1.6;margin-top:6px">Support installation health aur approved logs dekhta hai. School records isolated rehte hain jab tak exceptional audited policy approve na ho.</div></article></div>`,
'System Settings':()=>H('Platform configuration','System Settings','Platform preferences control karein; school branding override nahin hoti.',B('Save settings','Settings saved in preview',1))+`<div class="g2" style="margin-top:0;grid-template-columns:1fr 1fr"><article class="card pn"><div class="t">Platform operations</div><div class="s">Controls sirf Super Admin workspace par apply hote hain.</div>${[['Audit trail','Sensitive platform changes record karein'],['Backup health monitoring','Sirf per-install status'],['Support ticket SLA','Response workflow track karein'],['Maintenance notices','Authorized school admins ko notify karein']].map(x=>`<div class="ar"><div><b>${x[0]}</b><span>${x[1]}</span></div><button class="tg" aria-label="${x[0]}" onclick="this.classList.toggle('off')"></button></div>`).join('')}</article><article class="card pn"><div class="t">Languages & visual system</div><div class="s" style="line-height:1.6">School workspaces English, Roman Urdu aur Urdu RTL support karte hain. Platform theme sirf is workspace ka preview hai.</div><div class="th">${[['#92573a','#4c291b'],['#e11d48','#9f1239'],['#ea580c','#9a3412'],['#ca8a04','#854d0e'],['#059669','#065f46'],['#2563eb','#1e3a8a'],['#3558c8','#1b2a6b'],['#7c3aed','#4c1d95']].map(c=>`<button class="tm${c[0]===getComputedStyle(root).getPropertyValue('--brand').trim()?' on':''}" aria-label="theme" style="background:linear-gradient(135deg,${c[0]},${c[1]})" onclick="setTheme('${c[0]}','${c[1]}')"></button>`).join('')}</div><div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">${bd('g','Manual WhatsApp PDF · V1')}${bd('w','SMS / online payments · excluded')}</div></article></div>`};
function PL(){return [['Starter','Single school ke liye core records aur academic operations.',['Student/staff records','Attendance, marks, results','Free print templates','School theme & dashboard']],['Growth','Daily operations, fee records aur parent communication.',['Everything in Starter','Mobile roles aur notices','Manual fees & receipts','Website & online admissions']],['Complete','Expanded administration aur school-specific workflows.',['Everything in Growth','Advanced configurable options','Audit/backup visibility','Priority support workflow']]].map((x,i)=>`<article class="card plan${i===1?' pop':''}">${i===1?'<span class="rb">SUGGESTED</span>':''}<h3>${x[0]}</h3><p>${x[1]}</p><label>Custom quote per school</label><ul>${x[2].map(y=>`<li>${y}</li>`).join('')}</ul><button class="btn${i===1?' p':''} w" style="margin-top:0" onclick="notice('${x[0]} quote builder preview')">Create quote</button></article>`).join('')}
function setTheme(a,b){root.style.setProperty('--brand',a);root.style.setProperty('--brand2',b);notice('Platform theme updated');render()}
function toggleMode(){root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';notice(root.dataset.theme==='dark'?'Dark appearance enabled':'Light appearance enabled')}
function render(){const w=$('wrap');w.innerHTML=PG[page]();w.style.animation='none';w.offsetHeight;w.style.animation='';$('crumb').textContent=page;document.querySelectorAll('#nav button,#bt button').forEach(b=>b.classList.toggle('on',b.dataset.p===page))}
function go(p){page=p;document.body.classList.remove('open');render();scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
document.querySelectorAll('#bt button').forEach(b=>b.onclick=()=>b.dataset.p==='menu'?document.body.classList.add('open'):go(b.dataset.p));
$('mb').onclick=()=>innerWidth<=1100?document.body.classList.toggle('open'):$('shell').classList.toggle('collapsed');
$('q').onkeydown=e=>{if(e.key!=='Enter')return;const q=e.target.value.toLowerCase(),m=[['school','Schools & Installs'],['install','Schools & Installs'],['bill','Billing & Renewals'],['renew','Billing & Renewals'],['invoice','Billing & Renewals'],['plan','Plans & Add-ons'],['addon','Plans & Add-ons'],['ticket','Support Tickets'],['support','Support Tickets']].find(x=>q.includes(x[0]));m?(go(m[1]),notice('Opened '+m[1])):notice('Try: schools, billing, plans or support')};
$('mode').onclick=toggleMode;
render();
</script></body></html>
