<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Zee Education — School Dashboard</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.shell{display:grid;grid-template-columns:268px 1fr;min-height:100vh;transition:.25s}.shell.collapsed{grid-template-columns:0 1fr}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:#dbe4f4;padding:22px 14px;display:flex;flex-direction:column;gap:16px;overflow:hidden;transition:.25s}.collapsed .side{padding:0;opacity:0;pointer-events:none}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 22px color-mix(in srgb,var(--brand) 40%,transparent)}

.foot{margin-top:auto;padding:13px;border-radius:14px;background:#ffffff0a;font-size:11px;line-height:1.5;color:#8b9ab3}.foot b{color:#fff}
.main{min-width:0}.top{position:sticky;top:0;z-index:20;height:72px;display:flex;align-items:center;gap:14px;padding:0 28px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}

.wrap{max-width:1500px;margin:auto;padding:30px 28px 50px;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hd{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:22px;flex-wrap:wrap}.eb{font-size:11px;font-weight:700;color:var(--brand);letter-spacing:.12em;text-transform:uppercase}.hd h1{font-size:30px;letter-spacing:-.03em;margin:6px 0 4px}.hd p{margin:0;color:var(--muted);font-size:13px}
.bs{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;font-size:13px;font-weight:700;transition:.2s}.btn:hover{transform:translateY(-1px)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.pn{padding:20px}

.ri{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}.stat:first-child .ri{background:#ffffff26;color:#fff}
.stat label{display:block;margin-top:14px;font-size:12px;color:var(--muted);font-weight:600}.stat strong{display:block;font-size:26px;letter-spacing:-.03em;margin-top:4px}.stat small{font-size:12px;color:var(--muted)}
.up{position:absolute;top:18px;right:16px;font-size:12px;font-weight:700;color:#10b981;background:color-mix(in srgb,#10b981 14%,transparent);padding:4px 8px;border-radius:99px}.stat:first-child .up{color:#fff;background:#ffffff2e}
.g3{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px;margin-top:14px}.g2{display:grid;grid-template-columns:1.4fr .9fr;gap:14px;margin-top:14px}.g3e{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ph{display:flex;justify-content:space-between;align-items:start;gap:8px}.t{font-size:15px;font-weight:700}.s{font-size:12px;color:var(--muted);margin-top:3px}
.pill{font-size:11px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chart{height:230px;margin-top:14px}.chart svg{width:100%;height:100%}
.donut{width:150px;height:150px;border-radius:50%;margin:18px auto;display:grid;place-items:center;background:conic-gradient(#3b82f6 0 37%,#10b981 0 70%,#f59e0b 0 85%,#ec4899 0 95%,#8b5cf6 0)}.donut div{width:108px;height:108px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted)}.donut b{font-size:24px;color:var(--ink);display:block}
.lg{display:grid;gap:8px;font-size:12px}.lg div{display:flex;align-items:center;gap:8px}.lg i{width:9px;height:9px;border-radius:50%;background:var(--c)}.lg b{margin-left:auto}
.act{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.act:last-child{border:0}.act i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-style:normal;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}.act b{font-size:13px;display:block}.act span{font-size:12px;color:var(--muted)}.act time{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.bars{height:190px;display:flex;align-items:end;justify-content:space-around;margin-top:14px;border-bottom:1px solid var(--line)}.bi{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted)}.bi b{color:var(--ink);font-size:11px}.bi i{width:32px;border-radius:10px 10px 3px 3px;background:var(--c);height:var(--h)}
.rk{display:grid;grid-template-columns:26px 1fr 90px 36px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.rk:last-child{border:0}.rn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--c)}
.pr{height:7px;border-radius:7px;background:var(--line);overflow:hidden}.pr i{display:block;height:100%;border-radius:7px;background:var(--c)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-top:14px}.cal b{font-size:11px;color:var(--muted)}.cal span{font-size:12px;height:30px;display:grid;place-items:center;border-radius:50%}.cal .td{background:var(--brand);color:#fff;font-weight:800}
.tb{overflow:auto}table{width:100%;border-collapse:collapse;min-width:640px}th{padding:13px 16px;text-align:left;font-size:11px;letter-spacing:.06em;color:var(--muted);background:var(--bg);text-transform:uppercase}td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px}tr:hover td{background:var(--soft)}
.pe{display:flex;gap:10px;align-items:center}.pe i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--brand);font-style:normal;font-weight:800;font-size:11px}.pe b{display:block}.pe small{color:var(--muted);font-size:11px}
.bd{display:inline-block;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700}.g{background:color-mix(in srgb,#10b981 15%,transparent);color:#059669}.w{background:color-mix(in srgb,#f59e0b 18%,transparent);color:#b45309}.r{background:color-mix(in srgb,#ef4444 15%,transparent);color:#dc2626}.n{background:var(--soft);color:var(--muted)}
.lk{border:0;background:none;color:var(--brand);font-weight:700;font-size:13px}
.tool{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.tool .search{max-width:none}
select,.in{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:13px;width:100%}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.fg label{font-size:12px;color:var(--muted);font-weight:600}.fg select,.fg .in{margin-top:5px}
.sm{padding:20px}.sm label{font-size:12px;color:var(--muted);font-weight:600}.sm strong{display:block;font-size:26px;letter-spacing:-.03em;margin:6px 0}.sm span{font-size:12px;color:var(--muted)}
.ar{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.ar:last-child{border:0}.ar b{font-size:13px;display:block}.ar span{font-size:12px;color:var(--muted)}
.ch{display:flex;gap:4px}.ch button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:12px;color:var(--muted)}.ch button.on.P{background:#10b981;color:#fff;border-color:#10b981}.ch button.on.A{background:#ef4444;color:#fff;border-color:#ef4444}.ch button.on.L{background:#f59e0b;color:#fff;border-color:#f59e0b}
.flow{display:flex;gap:6px;margin-top:14px}.flow div{flex:1;padding:11px 6px;text-align:center;border-radius:12px;background:var(--bg);font-size:12px;color:var(--muted)}.flow .d{background:color-mix(in srgb,#10b981 15%,transparent);color:#059669;font-weight:700}.flow .nw{background:var(--soft);color:var(--brand);font-weight:700}
.sch{display:grid;grid-template-columns:70px repeat(5,1fr);min-width:620px;gap:6px;margin-top:14px;font-size:12px}.sch>div{padding:8px}.sch .h{font-weight:700;color:var(--muted);font-size:11px}.sl{border-radius:10px;font-weight:600;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.tp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.tpl{padding:16px}.pv{height:110px;border-radius:12px;border:1px solid var(--line);background:var(--bg);position:relative;overflow:hidden}.pv:before{content:'';position:absolute;inset:0 0 auto;height:22px;background:linear-gradient(100deg,var(--brand),var(--brand2))}
.th{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.tm{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);transition:.2s}.tm.on{box-shadow:0 0 0 3px var(--brand)}
.bt{display:none}.shade{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,100px);background:#0f172a;color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;box-shadow:0 14px 34px #0005;opacity:0;transition:.3s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,white);outline-offset:2px}
@media(max-width:1280px){.stats{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:1fr 1fr}.g3>:first-child{grid-column:span 2}}
@media(max-width:1100px){.shell,.shell.collapsed{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:50;transform:translateX(-105%);opacity:1;padding:22px 14px;pointer-events:auto}body.open .side{transform:none}body.open .shade{display:block;position:fixed;inset:0;background:#0b132499;z-index:45;backdrop-filter:blur(3px)}}
@media(max-width:780px){body{padding-bottom:78px}.top{padding:0 14px;height:64px}.search,.hl{display:none}.wrap{padding:20px 14px 30px}.hd h1{font-size:24px}.stats{grid-template-columns:1fr 1fr;gap:10px}.g3,.g2,.g3e{grid-template-columns:1fr}.g3>:first-child{grid-column:auto}.tp{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr}
.bt{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:64px;padding:6px;border-radius:22px;z-index:30;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 12px 30px #0f172a2e}.bt button{border:0;background:none;border-radius:16px;font-size:10px;font-weight:600;color:var(--muted);display:grid;place-items:center;align-content:center;gap:1px}.bt i{font-style:normal;font-size:17px}.bt button.on{background:var(--brand);color:#fff}}
@media(max-width:480px){.stats{grid-template-columns:1fr}.tp{grid-template-columns:1fr}}
</style>
<style id="m3-dashboard-refresh">
/* Material 3-inspired dark command header and tonal mobile navigation */
.top{height:78px!important;background:linear-gradient(105deg,#0b1628 0%,#142b4a 62%,#1c3963 100%)!important;border-bottom-color:#2b4262!important;box-shadow:0 10px 28px rgba(7,18,35,.22)!important;color:#fff}.top .crumb{min-width:178px}.top .crumb span{color:#b3c2d6}.top .crumb b{color:#fff}.top .search{background:#ffffff0d;border-color:#ffffff1e;color:#becce0}.top .search input{color:#fff}.top .search input::placeholder{color:#aab9cd}.top .search kbd{border-color:#ffffff23;color:#cbd7e6;background:#ffffff0b}.top .ib{background:#ffffff0d;border-color:#ffffff22;color:#fff}.top .ib:hover{background:#ffffff1c}.top .dot:after{border-color:#17304f}.top .av{box-shadow:0 5px 14px #0004}.mode{font-size:16px!important}.bt{background:color-mix(in srgb,var(--card) 90%,transparent)!important}.bt button.on{background:var(--soft)!important;color:var(--brand)!important;box-shadow:none!important}.bt button.on:before{content:'';position:absolute;width:38px;height:28px;border-radius:99px;background:color-mix(in srgb,var(--brand) 12%,transparent);z-index:-1}.bt button{position:relative}.nav button.on{box-shadow:0 9px 22px color-mix(in srgb,var(--brand) 32%,transparent)}

</style></head><body>
<div class="shell" id="shell"><aside class="side"><div class="brand"><div class="logo">Z</div><div><b>Zee Education</b><small>School Management System</small></div></div><div class="sc"><b id="schoolName">—</b><p id="schoolCity">School workspace</p></div><div class="lbl">WORKSPACE</div><nav class="nav" id="nav"></nav><div class="foot"><b>Dedicated school workspace</b><br>Records yahan sirf is school installation ke hain.</div></aside>
<main class="main"><header class="top"><button class="ib" id="mb" aria-label="Menu">☰</button><div class="crumb"><span id="crumbSchool">—</span><b id="crumb">Overview</b></div><label class="search">⌕<input id="q" placeholder="Search students, staff or records…"><kbd>Enter</kbd></label><div class="acts"><button class="ib hl" id="lang" aria-label="Change language">EN</button><button class="ib mode" id="mode" aria-label="Toggle appearance">◐</button><button class="ib dot" id="bell" aria-label="Notifications">🔔</button><button class="ib hl" id="quick" aria-label="Quick actions">＋</button><div class="av" id="avatar" title="Signed in"></div></div></header>
<section class="wrap" id="wrap"></section></main></div><div class="shade" onclick="document.body.classList.remove('open')"></div><nav class="bt" id="bt"></nav><div class="toast" id="toast"></div>
<script>
const DATA=__ZEE_DATA__;
const $=id=>document.getElementById(id),root=document.documentElement;let page='Overview',searchTerm='';
const notice=x=>{const t=$('toast');t.textContent=x;t.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>t.classList.remove('show'),2600)};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const COLORS=['#3b82f6','#10b981','#f59e0b','#ec4899','#8b5cf6'];
const THEMES=[['#92573a','#4c291b'],['#e11d48','#9f1239'],['#ea580c','#9a3412'],['#ca8a04','#854d0e'],['#059669','#065f46'],['#2563eb','#1e3a8a'],['#3b4fb8','#1e2a5e'],['#7c3aed','#4c1d95']];
const LANGS=[['en','EN'],['roman-ur','RU'],['ur','اردو']];
const ZONES=['Asia/Karachi','Asia/Kolkata','Asia/Dubai','Europe/London','America/New_York','UTC'];
const ATT=['present','absent','leave'];
const stats=DATA.stats||[],students=DATA.students||[],register=DATA.register||[],invoices=DATA.invoices||[],receipts=DATA.receipts||[],assessments=DATA.assessments||[],marks=DATA.marks||[],timetable=DATA.timetable||[],homework=DATA.homework||[],notices=DATA.notices||[],staff=DATA.staff||[],templates=DATA.templates||[],activity=DATA.activity||[],trend=DATA.attendanceTrend||[],grades=DATA.grades||[],topClasses=DATA.topClasses||[],feeTrend=DATA.feeTrend||[],options=DATA.options||{};
let att=register.map(x=>{const i=ATT.indexOf(String(x.status||'').toLowerCase());return i<0?0:i+1;});
const N=[['Overview','⌂'],['Students','♙'],['Attendance','✓'],['Academics','▤'],['Fees & Accounts','₨'],['Staff & HR','♟'],['Timetable','◷'],['Reports & Print','▣'],['Settings','⚙']];
$('nav').innerHTML=N.map(n=>`<button data-p="${n[0]}"><i>${n[1]}</i>${n[0]}</button>`).join('');
$('bt').innerHTML=[['Overview','⌂','Home'],['Students','♙','Students'],['Attendance','✓','Attendance'],['Fees & Accounts','₨','Fees'],['menu','☰','Menu']].map(n=>`<button data-p="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join('');
const H=(e,t,s,a='')=>`<div class="hd"><div><div class="eb">${esc(e)}</div><h1>${esc(t)}</h1><p>${s}</p></div><div class="bs">${a}</div></div>`;
const B=(t,act,p)=>`<button class="btn${p?' p':''}" onclick="${act}">${t}</button>`;
const bd=(c,t)=>`<span class="bd ${c}">${esc(t)}</span>`;
const ini=n=>String(n||'').trim().split(' ').filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const person=(n,s)=>`<div class="pe"><i>${esc(ini(n))}</i><div><b>${esc(n)}</b><small>${esc(s)}</small></div></div>`;
const table=(h,r)=>`<div class="tb"><table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const sm=(l,v,s,c)=>`<div class="card sm"><label>${esc(l)}</label><strong>${esc(v)}</strong><span ${c?`style="color:#10b981"`:''}>${esc(s)}</span></div>`;
const empty=t=>`<div class="s" style="padding:18px 0;text-align:center">${esc(t)}</div>`;
const short=n=>{n=Number(n||0);if(n>=1000000)return (n/1000000).toFixed(2).replace(/\.00$/,'')+'M';if(n>=1000)return (n/1000).toFixed(1).replace(/\.0$/,'')+'K';return String(Math.round(n));};
const greeting=()=>{const h=new Date().getHours();const t=h<12?'Good morning':h<17?'Good afternoon':'Good evening';return t+', '+DATA.user.name+' ☀';};
const attendanceChart=()=>{
 if(!trend.length)return '<div class="chart" style="display:grid;place-items:center;color:var(--muted);font-size:13px">No attendance has been recorded yet</div>';
 const n=trend.length,x=i=>45+i*(585/Math.max(1,n-1)),y=p=>190-(Math.min(100,Math.max(80,Number(p)||80))-80)*8.2;
 const line=trend.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d.percent).toFixed(1)).join(' ');
 return `<div class="chart"><svg viewBox="0 0 680 230" preserveAspectRatio="none"><defs><linearGradient id="ar" x1="0" x2="0" y1="0" y2="1"><stop stop-color="var(--brand)" stop-opacity=".28"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs><g stroke="var(--line)"><path d="M42 26H660M42 67H660M42 108H660M42 149H660M42 190H660"/></g><g fill="var(--muted)" font-size="11"><text x="2" y="30">100%</text><text x="8" y="71">95%</text><text x="8" y="112">90%</text><text x="8" y="153">85%</text>${trend.map((d,i)=>`<text x="${(x(i)-6).toFixed(0)}" y="216">${esc(d.label)}</text>`).join('')}</g><path d="${line} L${x(n-1).toFixed(1)} 190 L45 190Z" fill="url(#ar)"/><path d="${line}" fill="none" stroke="var(--brand)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${trend.slice(1).map((d,i)=>`<circle cx="${x(i+1).toFixed(1)}" cy="${y(d.percent).toFixed(1)}" r="5" fill="var(--card)" stroke="var(--brand)" stroke-width="3"/>`).join('')}</svg></div>`;};
const gradeDonut=()=>{
 const total=grades.reduce((a,x)=>a+Number(x.students||0),0);
 if(!total)return '<article class="card pn"><div class="t">Students by grade</div><div class="s">Distribution across classes</div><div class="donut" style="background:#e8ecf3"><div><span><b>0</b>Students</span></div></div><div class="s" style="text-align:center;margin-top:8px">No student is enrolled yet</div></article>';
 let acc=0;const parts=[];grades.forEach((x,i)=>{const p=Number(x.students||0)/total*100;parts.push(COLORS[i%COLORS.length]+' '+acc.toFixed(2)+'% '+(acc+p).toFixed(2)+'%');acc+=p;});
 return `<article class="card pn"><div class="t">Students by grade</div><div class="s">Distribution across classes</div><div class="donut" style="background:conic-gradient(${parts.join(',')})"><div><span><b>${total}</b>Students</span></div></div><div class="lg">${grades.map((x,i)=>`<div style="--c:${COLORS[i%COLORS.length]}"><i></i>${esc(x.class_name||'—')}<b>${Number(x.students||0)}</b></div>`).join('')}</div></article>`;};
const feeBars=()=>{
 if(!feeTrend.length)return empty('No collection has been recorded yet');
 const max=Math.max(1,...feeTrend.map(x=>Number(x.total||0)));
 return `<div class="bars">${feeTrend.map((x,i)=>`<div class="bi"><b>${esc(short(x.total))}</b><i style="--h:${Math.round(Number(x.total||0)/max*160)}px;--c:${COLORS[i%COLORS.length]}"></i>${esc(x.label)}</div>`).join('')}</div><div class="s" style="margin-top:12px">Total collected <b style="float:right;color:var(--ink)">${esc(DATA.feeSummary.collected)} <span style="color:#10b981">${esc(DATA.feeSummary.change)}</span></b></div>`;};
const topClassList=()=>{
 if(!topClasses.length)return '<article class="card pn"><div class="t">Top classes</div><div class="s">Attendance this week</div>'+empty('No attendance has been recorded yet')+'</article>';
 return `<article class="card pn"><div class="t">Top classes</div><div class="s">Attendance this week</div>${topClasses.map((x,i)=>`<div class="rk" style="--c:${COLORS[i%COLORS.length]}"><i class="rn">${i+1}</i><b>${esc(x.class_name||'—')}</b><span class="pr"><i style="width:${Number(x.percent||0)}%"></i></span><b>${Number(x.percent||0)}%</b></div>`).join('')}</article>`;};
const calendarCard=()=>{
 const c=DATA.calendar||{days:[],month:'',year:'',monthIndex:1,events:[]};
 const today=Number(DATA.today.date.slice(-2));
 const lead=new Date(Number(c.year||2026),Number(c.monthIndex||1)-1,1).getDay();
 const cells=Array.from({length:lead},()=>'<span></span>').concat((c.days||[]).map(d=>`<span class="${d===today?'td':''}">${d}</span>`));
 const ev=(c.events||[]).slice(0,3).map(e=>`<div class="s" style="margin-top:10px">🔵 ${esc(e.kind)} · ${esc(e.title)}</div>`).join('');
 return `<article class="card pn"><div class="ph"><div><div class="t">School calendar</div><div class="s">Events and reminders</div></div><span class="pill">${esc(c.month)} ${esc(c.year)}</span></div><div class="cal">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<b>${d}</b>`).join('')}${cells.join('')}</div>${ev||'<div class="s" style="margin-top:12px">No event is scheduled this month</div>'}</article>`;};
const studentTable=()=>{
 if(!students.length)return '<article class="card">'+empty('No student has been enrolled yet')+'</article>';
 const rows=students.map((x,i)=>`<tr data-s="${esc((x.name+' '+x.admission+' '+x.guardian).toLowerCase())}" data-c="${esc(x.class||'')}"><td>${person(x.name,x.admission||'—')}</td><td>${esc(x.admission)}</td><td>${esc(x.class||'—')}</td><td>${esc(x.guardian||'—')}</td><td>${bd(String(x.status).toLowerCase()==='active'?'g':'n',x.status)}</td><td><button class="lk" onclick="openStudent(${i})">View</button></td></tr>`).join('');
 const classOptions=(options.classes||[]).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
 return `<article class="card"><div class="tb"><table><thead><tr><th>Student</th><th>ID</th><th>Class</th><th>Guardian</th><th>Status</th><th></th></tr></thead><tbody id="studentRows">${rows}</tbody></table></div></article>`;};
const invoiceTable=()=>{
 if(!invoices.length)return '<article class="card">'+empty('No invoice has been raised yet')+'</article>';
 return `<article class="card">${table(['Student','Invoice','Amount','Settled','Due','Status'],invoices.map(x=>[esc(x.student||'—'),'#'+esc(x.id),esc(x.amount),esc(x.settled),esc(x.due),bd(String(x.status).toLowerCase()==='paid'?'g':String(x.status).toLowerCase()==='due'?'w':'n',x.status)]))}</article>`;};
const receiptTable=()=>{
 if(!receipts.length)return empty('No receipt has been recorded yet');
 return table(['Receipt','Mode','Amount','Date'],receipts.map(x=>[esc(x.receipt_number||'—'),esc(x.payment_mode||'—'),'PKR '+esc(Number(x.amount_paid||0).toLocaleString('en-US')),esc(String(x.paid_at||'').slice(0,10))]));};
const assessmentHeader=()=>{
 const a=assessments[0];if(!a)return '<div class="ph"><div><div class="t">No assessment yet</div><div class="s">Create the first assessment to start entering marks</div></div></div>';
 return `<div class="ph"><div><div class="t">${esc(a.name)}</div><div class="s">${esc(a.class||'—')}${a.subject?' · '+esc(a.subject):''} · Max ${esc(a.max)}</div></div>${bd(a.status==='published'?'g':a.status==='draft'?'w':'n',a.status)}</div>`;};
const marksTable=()=>{
 const a=assessments[0];if(!a)return empty('No assessment has been created yet');
 const rows=marks.filter(m=>Number(m.assessment)===Number(a.id));
 if(!rows.length)return empty('No marks have been entered for this assessment');
 return table(['Student','Score / '+a.max,'Result'],rows.map(m=>[esc(m.student),`<input class="in mk" style="width:110px;height:34px" data-a="${esc(a.id)}" data-s="${esc(m.studentId)}" value="${esc(m.value)}">`,esc(m.percent)]));};

`<div class="stats">${stats.map(s=>`<div class="card stat" style="--c:${esc(s[5])}"><div class="ri">${s[0]}</div>${s[4]?`<span class="up">↗ ${esc(s[4])}</span>`:''}<label>${esc(s[1])}</label><strong>${esc(s[2])}</strong><small>${esc(s[3])}</small></div>`).join('')}</div>

${calendarCard()}</div>`;

function setTheme(a,b){root.style.setProperty('--brand',a);root.style.setProperty('--brand2',b);ZEE.saveSettings({brand_primary:a,brand_secondary:b});}
function toggleMode(){root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';notice(root.dataset.theme==='dark'?'Dark appearance enabled':'Light appearance enabled')}
function render(){$('wrap').innerHTML=PG[page]();$('wrap').style.animation='none';$('wrap').offsetHeight;$('wrap').style.animation='';$('crumb').textContent=page;document.querySelectorAll('#nav button,#bt button').forEach(b=>b.classList.toggle('on',b.dataset.p===page));wireStudentFilter();}
function go(p){page=p;document.body.classList.remove('open');render();scrollTo({top:0,behavior:'smooth'})}
function wireStudentFilter(){const q=$('sq'),c=$('sclass');if(!q)return;const apply=()=>{const term=q.value.trim().toLowerCase(),cls=c.value;document.querySelectorAll('#studentRows tr[data-s]').forEach(tr=>{const okT=!term||tr.dataset.s.indexOf(term)>-1,okC=!cls||tr.dataset.c===cls;tr.style.display=(okT&&okC)?'':'none';});};q.oninput=apply;c.onchange=apply;apply();}
function submitRegister(){const entries=[];for(let i=0;i<register.length;i++){const v=att[i]||0;if(!v)continue;entries.push({student_id:register[i].record,status:ATT[v-1]});}if(!entries.length){notice('Mark at least one student before submitting');return;}ZEE.submitAttendance(entries);}
function saveMarks(id){const entries=[];document.querySelectorAll('.mk[data-a="'+id+'"]').forEach(el=>{entries.push({student_id:Number(el.dataset.s),marks_obtained:el.value});});if(!entries.length){notice('There is no mark to save');return;}ZEE.saveMarks(id,entries);}
function saveSettings(){const lang=$('langSel'),tz=$('tzSel');ZEE.saveSettings({language:lang?lang.value:'',timezone:tz?tz.value:''});}
function openStudent(i){const s=students[i];if(!s)return;ZEE.showDetails(s.name,'<div style="display:grid;gap:6px"><div><b>Admission number:</b> '+esc(s.admission||'—')+'</div><div><b>Class:</b> '+esc(s.class||'—')+'</div><div><b>Guardian:</b> '+esc(s.guardian||'—')+'</div><div><b>Status:</b> '+esc(s.status||'—')+'</div></div>');}

function openNotices(){const N2=notices;ZEE.showDetails('Notices ('+N2.length+')',N2.length?N2.map(n=>'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>'+esc(n.title)+'</b><div style="font-size:12px;color:var(--muted);margin-top:3px">'+esc(n.content||'')+'</div><div style="font-size:11px;color:var(--muted);margin-top:4px">'+esc(n.audience)+' · '+esc(n.date)+' · '+(n.published?'Published':'Draft')+'</div></div>').join(''):'<p style="margin:0;color:var(--muted)">No notice has been published yet.</p>');}

$('lang').onclick=cycleLanguage;
$('avatar').onclick=()=>ZEE.showDetails(DATA.user.name,'<div style="display:grid;gap:6px"><div><b>Role:</b> '+esc(DATA.user.role)+'</div><div><b>School:</b> '+esc(DATA.school.name)+'</div><div><b>Timezone:</b> '+esc(DATA.settings.timezone||'—')+'</div></div>');
$('q').onkeydown=e=>{if(e.key!=='Enter')return;const q=e.target.value.trim().toLowerCase();if(!q){notice('Type a student or staff name');return;}const hits=[];students.forEach(s=>{if((s.name+' '+s.admission+' '+s.guardian).toLowerCase().indexOf(q)>-1)hits.push(s.name);});staff.forEach(s=>{if((s.name+' '+s.role).toLowerCase().indexOf(q)>-1)hits.push(s.name);});if(!hits.length){notice('No record matches "'+q+'"');return;}searchTerm=q;go('Students');notice(hits.length+' match'+(hits.length===1?'':'es')+': '+hits.slice(0,3).join(', '));};
$('schoolCity').textContent=DATA.school.city+' · School workspace';
$('schoolName').textContent=DATA.school.name;
$('crumbSchool').textContent=DATA.school.name;
$('avatar').textContent=DATA.user.initials;
$('lang').textContent=(LANGS.find(x=>x[0]===(DATA.settings.language||'en'))||LANGS[0])[1];
if(DATA.settings.brand_primary)root.style.setProperty('--brand',DATA.settings.brand_primary);
if(DATA.settings.brand_secondary)root.style.setProperty('--brand2',DATA.settings.brand_secondary);
render();
</script></body></html>
